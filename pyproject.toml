[project]
name = "AluBot"
version = "1.0.7"
description = "Personal Discord Bot"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14"
authors = [{ name = "Aluerie", email = "aluerie@gmail.com" }]
maintainers = [{ name = "Aluerie", email = "aluerie@gmail.com" }]
urls.Homepage = "https://github.com/Aluerie/AluBot"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python ",
    "Topic :: Discord Bots",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles",
    "aiohttp",
    "asyncpg",
    "beautifulsoup4",
    "click",
    "dateparser",
    "discord-py[speed,voice]",
    "emoji",
    "ffmpeg",
    "githubkit",
    "gtts",
    "jishaku",
    "lru-dict",
    "lxml",
    "matplotlib",
    "numpy",
    "orjson",
    "parsedatetime",
    "pillow",
    "psutil",
    "pulsefire",
    "pydantic-settings>=2.16.0",
    "pygit2",
    "python-dateutil",
    "role-identification",
    "steamio",
    "tabulate",
    "thefuzz",
    "twitchio[starlette]",
    "unidiff",
    "urllib3",
    "uvloop ; sys_platform == 'linux'",
]


[tool.uv.sources]
steamio = { git = "https://github.com/Aluerie/steam.py", rev = "introduce-ext.dota2" }
jishaku = { git = "https://github.com/Gorialis/jishaku.git" }
role-identification = { git = "https://github.com/meraki-analytics/role-identification.git" }

[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "asyncpg-stubs",
    "ipykernel",
    "ty>=0.0.89",
]

[[tool.uv.index]]
name = "umbra"
url = "https://about.abstractumbra.dev/pip/"
explicit = true

[tool.uv]
package = false


[tool.ty.rules]
all = "error"
dynamic-function-decorator-return = "ignore" # TwitchIO's decorators return `Any`
possibly-missing-import = "ignore" # False positives, maybe we'll try it later.
unsound-assignment = "ignore" # `Any` is fine
unsound-return-statement = "ignore" # `Any` is fine
unsound-yield = "ignore" # `Any` is fine


[tool.ruff]
preview = true
line-length = 125
target-version = "py314"
exclude = [".venv"]
src = ["src"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Recommended to disable by https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "incorrect-blank-line-before-class",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "multi-line-implicit-string-concatenation",
    # Docstring related
    "docstring-missing-exception", 
    "docstring-missing-returns",
    "docstring-missing-yields",
    "undocumented-magic-method",
    # Complexity memes
    "complex-structure",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements-in-try-clause",
    # Todo
    "line-contains-todo", # I use TODO Tree VSCode extension for this
    "missing-todo-author",
    "missing-todo-link",
    # Other (uncategorized) Rules
    "ambiguous-unicode-character-string",
    "any-type",
    "assert", # assert is fine for "casting" type checks and in tests
    "commented-out-code",
    "implicit-namespace-package", # Annoying rule, it doesn't know what **I** want to be an implicit namespace-package
    "magic-value-comparison", # I hate this rule (quoting @AbstractUmbra)
    "no-self-use",
    "non-empty-init-module", # we do some stuff here
    "suspicious-non-cryptographic-random-usage",
    "undefined-local-with-import-star",
    "undefined-local-with-import-star-usage",
]
extend-select = [
    # NumPy Doc convention turns these rules off
    "multi-line-summary-first-line", 
    "undocumented-param",
]
unfixable = [
    "commented-out-code",
    "unused-noqa",
]
flake8-quotes.inline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"{src/ext/beta.py,templates/fresh_beta.py,src/alpha.py,src/zeta.py,*.ipynb}" = [
    # These files are my playground to mess around and test stuff.
    "ANN",
    "D", 
    "missing-copyright-notice",
    "print",
    "unused-method-argument",
    "unused-noqa",
]
"src/ext/*.py" = [
    "undocumented-param", # I don't want to document all the `ctx: AluContext`
]

[tool.ruff.format]
quote-style = "double"            
indent-style = "space"
skip-magic-trailing-comma = false        
line-ending = "auto"              


[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
